    <script>
    layui.use(['layer', 'element'], function(){
        var layer = layui.layer;
        var element = layui.element;
        element.render();
    });

    // 倒计时功能
    var totalTime = 15 * 60; // 15分钟
    var currentTime = totalTime;
    
    function updateTimer() {
        var minutes = Math.floor(currentTime / 60);
        var seconds = currentTime % 60;
        document.getElementById('timeDisplay').textContent = 
            (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        
        if (currentTime <= 300) { // 5分钟警告
            document.getElementById('timer').classList.add('warning');
        }
        
        if (currentTime <= 0) {
            autoSubmit();
        }
        
        currentTime--;
    }
    
    var timerInterval = setInterval(updateTimer, 1000);
    
    // 自动提交
    function autoSubmit() {
        clearInterval(timerInterval);
        layer.msg('考试时间到，正在自动提交...', {icon: 0, time: 2000}, function(){
            document.getElementById('quizForm').submit();
        });
    }
    
    // 更新进度条
    function updateProgress() {
        var totalQuestions = 1;
        var answeredQuestions = 0;
        
        // 统计已回答的题目
        var questionCards = document.querySelectorAll('.question-card');
        questionCards.forEach(function(card) {
            var inputs = card.querySelectorAll('input[type="radio"], input[type="checkbox"], input[type="text"]');
            var isAnswered = false;
            inputs.forEach(function(input) {
                if ((input.type === 'radio' || input.type === 'checkbox') && input.checked) {
                    isAnswered = true;
                } else if (input.type === 'text' && input.value.trim() !== '') {
                    isAnswered = true;
                }
            });
            if (isAnswered) answeredQuestions++;
        });
        
        var progress = (answeredQuestions / totalQuestions) * 100;
        document.getElementById('progressBar').style.width = progress + '%';
    }
    
    // 确认提交
    function confirmSubmit() {
        var totalQuestions = 1;
        var answeredQuestions = 0;
        
        var questionCards = document.querySelectorAll('.question-card');
        questionCards.forEach(function(card) {
            var inputs = card.querySelectorAll('input[type="radio"], input[type="checkbox"], input[type="text"]');
            var isAnswered = false;
            inputs.forEach(function(input) {
                if ((input.type === 'radio' || input.type === 'checkbox') && input.checked) {
                    isAnswered = true;
                } else if (input.type === 'text' && input.value.trim() !== '') {
                    isAnswered = true;
                }
            });
            if (isAnswered) answeredQuestions++;
        });
        
        if (answeredQuestions < totalQuestions) {
            return confirm('您还有 ' + (totalQuestions - answeredQuestions) + ' 道题未作答，确定要提交吗？');
        }
        
        return confirm('确定要提交答案吗？提交后将无法修改。');
    }
    
    // 选项点击效果
    document.querySelectorAll('.option-item').forEach(function(item) {
        item.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') {
                var input = this.querySelector('input');
                if (input.type === 'radio') {
                    input.checked = true;
                } else if (input.type === 'checkbox') {
                    input.checked = !input.checked;
                }
                updateProgress();
            }
        });
    });
    
    // 页面加载时初始化进度
    updateProgress();
    
    // 防止刷新页面
    window.onbeforeunload = function() {
        return "您正在答题中，确定要离开吗？";
    };
    
    // 提交时取消提示
    document.getElementById('quizForm').addEventListener('submit', function() {
        window.onbeforeunload = null;
    });
    </script>
