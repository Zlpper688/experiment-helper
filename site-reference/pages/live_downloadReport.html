    <script src="layui/layui.js"></script>
    <script>
        layui.use('form', function(){
            var form = layui.form;
            // 如地址栏已带 fname 参数，则自动选中
            var urlParams = new URLSearchParams(location.search);
            if (urlParams.has('fname')) {
                var fnameVal = urlParams.get('fname');
                var radios = document.querySelectorAll('input[name="fname"]');
                for (var i = 0; i < radios.length; i++) {
                    if (radios[i].value === fnameVal) {
                        radios[i].checked = true;
                        break;
                    }
                }
            }
        });

        function downFile() {
            var code = document.querySelector('input[name="fname"]:checked');
            if (!code) {
                layui.layer.msg('请先选择下载的报告');
                return false;
            }
            /* 随机码取自 disabled 的那个 input */
            var random = document.getElementById('random').value || 0;
            location.href = 'pdf6/downloadall.php?fname=' + code.value + '&random=' + random;
            return false;
        }
    </script>
